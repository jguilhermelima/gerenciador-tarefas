{% from 'bootstrap5/form.html' import render_form %}
{% include "header.html" %}
<body
     style="background-image: url('../static/assets/img/background.jpg')"

>
<div class="p-2 my-2 text-center">
    {% if is_edit: %}
        <h2>Editar Tarefa</h2>
    {% else: %}
        <h2>Nova Tarefa</h2>
    {% endif %}
</div>
<main class="mb-4">
  <div class="container">
    <div class="row">
      <div class="col-lg-8 col-md-10 mx-auto">
        {{ ckeditor.load() }}
        {{ ckeditor.config(name='body') }}
        {{ render_form(form, novalidate=True) }}
      </div>
    </div>
  </div>
</main>
</body>
